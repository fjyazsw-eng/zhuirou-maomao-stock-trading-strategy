project_name: 股票AI交易助手
project_version: workflow-portable-v1

paths:
  workflow_state: reports/workflow/current_workflow_state.json
  workflow_history: reports/workflow/history
  market_database: data/sqlite/market_120d.sqlite

data_sources:
  primary: hithink-finance
  key_env: HITHINK_FINANCE_API_KEY
  minute_only: mootdx
  minute_intervals: [1m, 5m, 15m, 30m, 60m]
  fallback: []
  on_failure: error
  allow_mock: false
  allow_unknown_cache: false

workflow:
  default_quantity: 100
  priority:
    - data_reliability
    - systemic_risk_gate
    - reality_market_analysis
    - hexagram_downgrade_only
    - night_candidates
    - intraday_veto
    - holding_management
    - review

safety:
  real_account_connected: false
  auto_trading_enabled: false
  allow_hexagram_upgrade: false
  allow_intraday_third_candidate: false
