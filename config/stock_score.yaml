version: "1.0.0-stock-mvp"
effective_date: "2026-07-02"
change_reason: "新增个股执行评分MVP：只评价执行条件，市场、板块、龙头仅作为门控，不重复计入100分"
score_total: 100
components:
  trend_structure:
    max_points: 30
    subfeatures:
      ma_position:
        max_points: 10
        bands:
          - {min: 3, points: 10, label: "close_above_ma5_ma10_ma20"}
          - {min: 2, points: 7, label: "close_above_two_ma"}
          - {min: 1, points: 3, label: "close_above_one_ma"}
          - {min: null, points: 0, label: "below_key_ma"}
      ma_alignment:
        max_points: 8
        bands:
          - {min: 2, points: 8, label: "bull_alignment"}
          - {min: 1, points: 5, label: "partial_alignment"}
          - {min: null, points: 1, label: "weak_alignment"}
      recent_direction:
        max_points: 7
        bands:
          - {min: 2, points: 7, label: "three_and_five_day_positive"}
          - {min: 1, points: 4, label: "mixed_positive"}
          - {min: null, points: 0, label: "recent_negative"}
      high_low_structure:
        max_points: 5
        bands:
          - {min: 0.75, points: 5, label: "near_range_high"}
          - {min: 0.50, points: 3, label: "mid_upper_range"}
          - {min: 0.25, points: 1, label: "mid_lower_range"}
          - {min: null, points: 0, label: "near_range_low"}
    break_ma10_cap: 18
    break_ma20_cap: 12
  volume_price_quality:
    max_points: 30
    subfeatures:
      amount_vs_5d_avg:
        max_points: 10
        bands:
          - {min: 1.2, max: 2.5, points: 10, label: "moderate_expansion"}
          - {min: 0.8, max: 1.2, points: 7, label: "stable_volume"}
          - {min: 2.5, max: 4.0, points: 5, label: "large_expansion"}
          - {min: 0.5, max: 0.8, points: 4, label: "shrinking"}
          - {min: null, points: 1, label: "abnormal_volume"}
      close_position:
        max_points: 8
        bands:
          - {min: 0.75, points: 8, label: "strong_close"}
          - {min: 0.55, points: 6, label: "good_close"}
          - {min: 0.35, points: 3, label: "neutral_close"}
          - {min: null, points: 0, label: "weak_close"}
      volume_price_3d:
        max_points: 7
        bands:
          - {min: 2, points: 7, label: "multi_day_positive_coordination"}
          - {min: 1, points: 4, label: "some_coordination"}
          - {min: null, points: 0, label: "poor_coordination"}
      turnover_quality:
        max_points: 5
        bands:
          - {min: 1.0, max: 12.0, points: 5, label: "reasonable_turnover"}
          - {min: 0.3, max: 20.0, points: 3, label: "acceptable_turnover"}
          - {min: null, points: 1, label: "turnover_extreme_or_low"}
    volume_down_cap: 15
    stagnation_cap: 18
    weak_close_expansion_cap: 16
  position_heat:
    max_points: 25
    subfeatures:
      ma_distance:
        max_points: 10
        bands:
          - {min: 0.00, max: 0.08, points: 10, label: "close_to_ma_reasonable"}
          - {min: -0.04, max: 0.00, points: 8, label: "pullback_near_ma"}
          - {min: 0.08, max: 0.15, points: 5, label: "some_extension"}
          - {min: -0.10, max: -0.04, points: 3, label: "below_ma"}
          - {min: null, points: 1, label: "too_extended_or_weak"}
      short_return_heat:
        max_points: 7
        bands:
          - {min: -0.03, max: 0.10, points: 7, label: "healthy_short_gain"}
          - {min: 0.10, max: 0.20, points: 4, label: "warm"}
          - {min: -0.10, max: -0.03, points: 3, label: "weak_pullback"}
          - {min: null, points: 1, label: "overheated_or_weak"}
      price_percentile_20d:
        max_points: 5
        bands:
          - {min: 0.45, max: 0.85, points: 5, label: "upper_but_not_extreme"}
          - {min: 0.25, max: 0.45, points: 3, label: "middle"}
          - {min: 0.85, max: 0.95, points: 2, label: "high_position"}
          - {min: null, points: 1, label: "extreme_or_low"}
      amount_percentile_20d:
        max_points: 3
        bands:
          - {min: 0.30, max: 0.85, points: 3, label: "normal_heat"}
          - {min: 0.85, max: 0.95, points: 2, label: "hot_volume"}
          - {min: null, points: 1, label: "cold_or_extreme"}
    overheat_rules:
      bias_ma5_min: 0.10
      return_5d_min: 0.18
      price_percentile_20d_min: 0.90
      amount_percentile_20d_min: 0.90
  tradability:
    max_points: 15
    subfeatures:
      amount_liquidity:
        max_points: 7
        bands:
          - {min: 1000000000, points: 7, label: "high_liquidity"}
          - {min: 300000000, points: 5, label: "adequate_liquidity"}
          - {min: 100000000, points: 3, label: "low_but_tradable"}
          - {min: null, points: 0, label: "low_liquidity"}
      market_cap:
        max_points: 4
        bands:
          - {min: 10000000000, points: 4, label: "adequate_float_mv"}
          - {min: 3000000000, points: 2, label: "small_float_mv"}
          - {min: null, points: 0, label: "tiny_float_mv"}
      amount_stability_5d:
        max_points: 4
        bands:
          - {min: 0.25, points: 4, label: "stable"}
          - {min: 0.12, points: 2, label: "unstable"}
          - {min: null, points: 1, label: "extreme_unstable"}
filters:
  exclude_bj: true
  min_valid_days: 20
  min_valid_days_5d: 5
  new_stock_calendar_days: 60
risk_rules:
  volume_down:
    return_max: -0.02
    amount_vs_5d_avg_min: 1.3
  high_fade:
    close_position_max: 0.35
    upper_shadow_min: 0.45
  consecutive_high_fade:
    days_lookback: 3
    min_days: 2
  stagnation:
    abs_return_max: 0.01
    amount_vs_5d_avg_min: 1.8
    close_position_max: 0.55
  break_ma10:
    enabled: true
  break_ma20:
    enabled: true
  volatility_5d:
    max_range: 0.28
  low_liquidity:
    amount_yuan_min: 100000000
  single_day_spike:
    return_min: 0.08
    close_position_min: 0.70
  lagging_strong_sector:
    sector_grade_prefix: ["A", "B"]
    relative_to_sector_5d_max: -0.03
  independent_move:
    stock_return_5d_min: 0.08
    sector_return_5d_max: 0.02
status_rules:
  ready_min_score: 78
  wait_confirm_min_score: 62
  weak_structure_max_score: 50
  market_score_ready_floor: 40
  min_sector_grade_for_ready: "C"
  overheat_status: "OVERHEATED"
  pullback_when_overheated_and_strong: "WAIT_PULLBACK"
  volume_down_status: "AVOID"
  break_ma20_status: "WEAK_STRUCTURE"
  break_ma10_status: "WEAK_STRUCTURE"
  low_liquidity_status: "AVOID"
  data_insufficient_status: "DATA_INSUFFICIENT"
grades:
  - {min: 85, grade: "A级执行条件"}
  - {min: 75, grade: "B级可执行观察"}
  - {min: 65, grade: "C级等待确认"}
  - {min: 55, grade: "D级偏谨慎"}
  - {min: null, grade: "E级回避"}
