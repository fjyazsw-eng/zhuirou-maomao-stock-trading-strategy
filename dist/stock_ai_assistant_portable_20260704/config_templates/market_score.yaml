version: "1.0.1-mvp1-calibrated"
effective_date: "2026-07-01"
change_reason: "有限范围校准：市场趋势改为1/3/5日综合，成交低于5日均值不高分，宽度阈值收紧；评分结构和权重不变"
score_total: 100
components:
  index_trend:
    max_points: 40
    feature: "index_trend_composite"
    bands:
      - {min: 0.040, points: 40, label: "multi_day_strong"}
      - {min: 0.025, points: 32, label: "trend_positive"}
      - {min: 0.010, points: 24, label: "trend_repair"}
      - {min: 0.000, points: 16, label: "single_day_or_flat"}
      - {min: null, points: 6, label: "trend_weak"}
  market_turnover_change:
    max_points: 30
    feature: "turnover_quality"
    bands:
      - {min: 1.15, points: 30, label: "clear_expansion"}
      - {min: 1.05, points: 22, label: "moderate_expansion"}
      - {min: 1.00, points: 16, label: "flat_turnover"}
      - {min: 0.95, points: 10, label: "slightly_shrinking"}
      - {min: null, points: 5, label: "shrinking"}
  market_breadth:
    max_points: 30
    feature: "up_ratio"
    bands:
      - {min: 0.65, points: 30, label: "broad_rally"}
      - {min: 0.58, points: 22, label: "good_breadth"}
      - {min: 0.52, points: 16, label: "medium_positive"}
      - {min: 0.45, points: 10, label: "mixed"}
      - {min: null, points: 4, label: "poor_breadth"}
grades:
  - {min: 70, grade: "环境较好，可主动寻找机会"}
  - {min: 55, grade: "结构性市场"}
  - {min: 40, grade: "环境偏弱"}
  - {min: null, grade: "风险环境"}
