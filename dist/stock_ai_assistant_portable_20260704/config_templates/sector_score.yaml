version: "1.0.1-mvp1-calibrated"
effective_date: "2026-07-01"
change_reason: "有限范围校准：板块相对强度改为1/3/5日综合，资金集中改为成交占比变化系数；评分结构和权重不变"
score_total: 100
sector_standard: "SW2021_L2"
components:
  relative_market_strength:
    max_points: 35
    feature: "relative_strength_composite"
    weights:
      relative_return_1d: 0.20
      relative_return_3d: 0.30
      relative_return_5d: 0.50
    bands:
      - {min: 0.030, points: 35, label: "multi_day_far_outperform"}
      - {min: 0.020, points: 28, label: "multi_day_outperform"}
      - {min: 0.010, points: 21, label: "moderate_outperform"}
      - {min: 0.000, points: 14, label: "slightly_outperform"}
      - {min: -0.010, points: 7, label: "slightly_underperform"}
      - {min: null, points: 2, label: "underperform"}
  amount_concentration:
    max_points: 30
    feature: "amount_share_change_ratio"
    guard_features:
      require_positive_return_used: true
      require_close_position_not_available: true
    bands:
      - {min: 1.80, points: 30, label: "strong_inflow_concentration"}
      - {min: 1.40, points: 24, label: "clear_concentration"}
      - {min: 1.15, points: 18, label: "moderate_concentration"}
      - {min: 1.00, points: 12, label: "slight_concentration"}
      - {min: 0.85, points: 6, label: "not_concentrating"}
      - {min: null, points: 2, label: "shrinking_share"}
  breadth:
    max_points: 20
    feature: "up_ratio"
    bands:
      - {min: 0.75, points: 20, label: "broad_strength"}
      - {min: 0.60, points: 16, label: "positive"}
      - {min: 0.50, points: 11, label: "mixed_positive"}
      - {min: 0.40, points: 6, label: "mixed_weak"}
      - {min: null, points: 2, label: "weak"}
  persistence_3_5d:
    max_points: 15
    subfeatures:
      outperform_market_days_5d:
        max_points: 5
        bands:
          - {min: 5, points: 5}
          - {min: 4, points: 4}
          - {min: 3, points: 3}
          - {min: 2, points: 1.5}
          - {min: null, points: 0}
      breadth_ge_50_days_5d:
        max_points: 5
        bands:
          - {min: 5, points: 5}
          - {min: 4, points: 4}
          - {min: 3, points: 3}
          - {min: 2, points: 1.5}
          - {min: null, points: 0}
      amount_share_up_days_5d:
        max_points: 5
        bands:
          - {min: 4, points: 5}
          - {min: 3, points: 4}
          - {min: 2, points: 2.5}
          - {min: 1, points: 1}
          - {min: null, points: 0}
grades:
  - {min: 85, grade: "A级，强主线候选"}
  - {min: 75, grade: "B级，强势板块"}
  - {min: 65, grade: "C级，轮动或修复板块"}
  - {min: 55, grade: "D级，普通或转弱板块"}
  - {min: null, grade: "E级，弱势或退潮板块"}
quality_rules:
  min_valid_constituents: 5
  min_quote_coverage: 0.70
  min_weighted_mv_coverage: 0.70
