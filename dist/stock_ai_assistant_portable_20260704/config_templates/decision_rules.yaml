version: "1.0.0-decision-mvp"
effective_date: "2026-07-02"
change_reason: "新增一键决策流程MVP：组合市场、板块、龙头、个股执行结果；只做门控和优先级，不重新加权评分"
core_labels:
  - "情绪龙头"
  - "容量核心"
  - "趋势核心"
identity:
  multi_core_min_labels: 2
  secondary_grade_prefixes: ["B"]
  follower_min_leader_score: 55
  weak_max_leader_score: 54.999
market_gate:
  ready_core_min_market_score: 40
  downgrade_to: "WAIT_CONFIRM"
sector_gate:
  min_grade_prefix_for_ready: ["A", "B", "C"]
  downgrade_to: "WAIT_CONFIRM"
stock_status_mapping:
  READY:
    MULTI_CORE: "READY_CORE"
    CORE: "READY_CORE"
    SECONDARY: "READY_SECONDARY"
    FOLLOWER: "READY_SECONDARY"
    WEAK: "READY_SECONDARY"
  WAIT_PULLBACK:
    MULTI_CORE: "WAIT_PULLBACK_CORE"
    CORE: "WAIT_PULLBACK_CORE"
    SECONDARY: "WAIT_CONFIRM"
    FOLLOWER: "WAIT_CONFIRM"
    WEAK: "WAIT_CONFIRM"
  WAIT_CONFIRM:
    default: "WAIT_CONFIRM"
  WEAK_STRUCTURE:
    default: "WEAK_STRUCTURE"
  AVOID:
    default: "AVOID"
  DATA_INSUFFICIENT:
    default: "DATA_INSUFFICIENT"
  OVERHEATED:
    MULTI_CORE: "WAIT_PULLBACK_CORE"
    CORE: "WAIT_PULLBACK_CORE"
    default: "WAIT_CONFIRM"
priority_order:
  - "DATA_INSUFFICIENT"
  - "AVOID"
  - "WEAK_STRUCTURE"
  - "WAIT_PULLBACK_CORE"
  - "WAIT_CONFIRM"
  - "READY_SECONDARY"
  - "READY_CORE"
stage_text:
  READY_CORE: "核心候选，执行条件可参与"
  READY_SECONDARY: "非核心候选，执行条件较好但优先级较低"
  WAIT_PULLBACK_CORE: "核心候选，但短期过热，等待回调"
  WAIT_CONFIRM: "等待确认"
  WEAK_STRUCTURE: "趋势结构偏弱"
  AVOID: "暂时回避"
  DATA_INSUFFICIENT: "数据不足"
notes:
  non_core_ready: "非核心候选，优先级较低"
  event_risk: "事件风险：未检查或数据缺失"
output:
  max_advantages: 3
  max_risks: 3
